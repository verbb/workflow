<div class="btn menubtn">{{ 'Set status' | t('workflow') }}</div>
<div class="menu">
    <ul>
        {% for statusValue, statusLabel in statuses %}
            <li>
                <a class="formsubmit" data-param="status" data-value="{{ statusValue }}" data-label="{{ statusLabel }}">
                    <span class="status {{ statusValue }}"></span> {{ statusLabel }}
                </a>
            </li>
        {% endfor %}
    </ul>
</div>
